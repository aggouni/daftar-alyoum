name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare persistent signing key (so updates don't wipe app data)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            echo "Using existing persistent keystore"
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "No keystore found yet, generating one for the first time"
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Daftar Alyoum,O=Aggouni,C=DZ"
            cp ~/.android/debug.keystore debug.keystore
          fi

      - name: Create Flutter project
        run: flutter create --org com.aggouni --project-name daftar_alyoum daftar_app

      - name: Add dependencies
        working-directory: daftar_app
        run: |
          flutter pub add shared_preferences
          flutter pub add google_fonts
          flutter pub add path_provider
          flutter pub add share_plus
          flutter pub add pdf
          flutter pub add printing

      - name: Copy app source code
        run: cp main.dart daftar_app/lib/main.dart

      - name: Apply custom app icon (if provided)
        working-directory: daftar_app
        run: |
          if [ -f ../icon.png ]; then
            mkdir -p assets/icon
            cp ../icon.png ../icon_background.png ../icon_foreground.png assets/icon/
            flutter pub add dev:flutter_launcher_icons
            {
              echo "flutter_launcher_icons:"
              echo "  android: true"
              echo "  ios: false"
              echo "  image_path: \"assets/icon/icon.png\""
              echo "  adaptive_icon_background: \"assets/icon/icon_background.png\""
              echo "  adaptive_icon_foreground: \"assets/icon/icon_foreground.png\""
              echo "  min_sdk_android: 21"
            } > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          else
            echo "No custom icon found, keeping default Flutter icon"
          fi

      - name: Set app name and permissions
        working-directory: daftar_app
        run: |
          sed -i 's/android:label="daftar_alyoum"/android:label="دفتر اليوم"/' android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest /s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: daftar_app
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-alyoum-apk
          path: daftar_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "دفتر اليوم - نسخة ${{ github.run_number }}"
          files: daftar_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the signing key permanently (first run only)
        run: |
          if [ -n "$(git status --porcelain debug.keystore)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Save persistent signing key [skip ci]"
            git push
          else
            echo "Keystore already saved, nothing to do"
          fi
